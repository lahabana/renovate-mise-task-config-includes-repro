# Reproduction repository for renovatebot/renovate#47868.
#
# The [task_config] includes entry below is a remote git ref of THIS repository
# (self-referential, so the repro is self-contained). Renovate's mise manager
# ignores it: remote refs in `[task_config] includes` are not extracted, so the
# pin is never shown on the dependency dashboard and never updated.
#
# Expected after the fix: a `task-include` dependency (github-tags datasource)
# for the pinned ref, with a PR bumping ref=v1.0.0 -> ref=v1.0.1.
[settings]
experimental = true

# A regular tool dependency: Renovate picks this up on every release and shows
# the update, proving the mise manager itself works in this repo. The missing
# task-include dependency above is the bug being reproduced.
[tools]
# Outdated on purpose: 1.8.1 is the latest release.
jq = "1.8.2"

# Remote task file (`tasks.<name>.file`): a second way to depend on shared
# tasks, pinned at a different tag than the include above. Unlike
# `[task_config] includes`, released Renovate already extracts this one.
[tasks.remote-hello]
file = "git::https://github.com/lahabana/renovate-mise-task-config-includes-repro.git//tasks/hello.sh?ref=v1.0.1"

[task_config]
includes = [
  "git::https://github.com/lahabana/renovate-mise-task-config-includes-repro.git//tasks?ref=v1.0.0",
]
